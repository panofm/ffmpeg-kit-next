name: Build iOS xcframeworks

# The xcframeworks this fork publishes were built on a Mac running an Xcode 27
# BETA, so every binary carried `LC_BUILD_VERSION sdk 27.0`. TestFlight accepts
# that; App Store review does not (ITMS-90512, max 26.5), and it rejected a
# release. The SDK stamp comes from whichever Xcode builds them, so the build
# belongs on a runner pinned to a RELEASED Xcode — not on a laptop whose
# default toolchain follows Apple's betas.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v9.0.0-pano.2). Created from the checked-out ref.'
        required: true
      xcode:
        description: 'Xcode to build with. Must be a RELEASED version — a beta stamps an SDK the App Store refuses.'
        required: false
        default: '26.4.1'

jobs:
  build:
    runs-on: macos-26
    # The job publishes a release, which the default read-only token cannot do.
    permissions:
      contents: write
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -switch "/Applications/Xcode_${{ inputs.xcode }}.app"
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      # The exact invocation v9.0.0-pano.1 recorded in its release notes. No
      # external libraries: the voice path needs `loudnorm` and `ebur128`, both
      # built into libavfilter.
      # The repo builds through its own Nix shell — that is where GNU sed and the
      # rest of the toolchain come from. Plain ./ios.sh on a Homebrew PATH gets
      # far enough to compile ffmpeg and then produces no ffmpeg-kit headers.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # nix-ios.sh runs ios.sh inside the shell. flake.nix honours DEVELOPER_DIR
      # and xcode-select, so the Xcode pinned above still supplies the SDK.
      - name: Build
        run: ./nix-ios.sh -p xcode26 -- --arch=arm64,arm64-simulator --enable-lib-ios-audiotoolbox -x --spm --speed

      - name: The build log, when it fails
        if: failure()
        run: tail -200 build.log || echo "(no build.log — the wrapper rejected its arguments before starting)"

      # The whole point of the job. App Store review refuses a binary whose
      # LC_BUILD_VERSION sdk is newer than the shipping SDK — ITMS-90512, "27.0
      # ... greater than the maximum allowed value of 26.5". Note 26.5 is the
      # CEILING, not a violation: a released Xcode stamping 26.5 is fine, and
      # the toolchain may stamp a point release above its own iphoneos SDK.
      # What is never fine is a whole major above the runner's released Xcode —
      # that only happens when someone builds on a beta, which is the bug here.
      - name: Refuse an SDK the App Store will reject
        run: |
          MAJOR="$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)"
          echo "runner Xcode major: $MAJOR"
          bad=0
          while IFS= read -r bin; do
            sdk="$(vtool -show-build-version "$bin" 2>/dev/null | awk '/^ *sdk /{print $2; exit}')"
            [ -z "$sdk" ] && continue
            echo "  $sdk  $bin"
            if [ "$(printf '%s' "$sdk" | cut -d. -f1)" -gt "$MAJOR" ]; then
              echo "::error::$bin is stamped sdk $sdk, a major above the runner's $MAJOR — built with a beta Xcode"
              bad=1
            fi
          done < <(find prebuilt -type f -perm +111 -path '*.framework/*' ! -name '*.plist')
          [ "$bad" = 0 ] || exit 1

      - name: Zip the xcframeworks
        run: |
          mkdir -p dist
          find prebuilt -name '*.xcframework' -maxdepth 4 -print0 | while IFS= read -r -d '' fw; do
            name="$(basename "$fw")"
            (cd "$(dirname "$fw")" && zip -qry "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
          done
          ls -la dist

      - name: Checksums for Package.swift
        run: |
          cd dist
          for z in *.zip; do
            echo "$z  $(swift package compute-checksum "$z")" | tee -a checksums.txt
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          {
            echo "Prebuilt iOS xcframeworks for panofm, from upstream v9.0.0."
            echo
            echo "Built with:"
            echo
            echo "    ./ios.sh --arch=arm64,arm64-simulator --enable-lib-ios-audiotoolbox -x --spm --speed"
            echo
            echo "Built on \`macos-26\` with Xcode ${{ inputs.xcode }} (iphoneos SDK $SDK) so every slice carries an SDK the App Store accepts. v9.0.0-pano.1 was built with an Xcode 27 beta and was rejected by ITMS-90512."
            echo
            echo "No external libraries beyond Apple's AudioToolbox: the voice path needs \`loudnorm\` and \`ebur128\`, which are built-in libavfilter filters."
            echo
            echo "LGPL-3.0, as upstream."
          } > dist/NOTES.md
          gh release create "${{ inputs.tag }}" dist/*.zip --title "${{ inputs.tag }}" --notes-file dist/NOTES.md
          cat dist/checksums.txt >> "$GITHUB_STEP_SUMMARY"
